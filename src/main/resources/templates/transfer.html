<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATM System - Transfer</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="dashboard-container">

    <div class="dashboard-header">
        <div>
            <h1>TRANSFER</h1>
            <p>Transfer money to another account</p>
        </div>

        <a href="/dashboard" class="logout-button">Back</a>
    </div>

    <div class="balance-card">
        <p>AVAILABLE BALANCE</p>
        <h2>R<span th:text="${#numbers.formatDecimal(account.balance, 1, 2)}"></span></h2>
    </div>

    <div class="dashboard-content">

        <h2>Transfer Money</h2>

        <p th:if="${error}" th:text="${error}" style="color: #ef4444; font-weight: bold;"></p>

        <form action="/transfer" method="post">

            <div class="form-group">
                <label for="accountNumber">Recipient Account Number</label>
                <input
                        type="text"
                        id="accountNumber"
                        name="accountNumber"
                        placeholder="Enter account number"
                        maxlength="9"
                        required
                >
            </div>

            <div class="form-group">
                <label for="amount">Amount to Transfer</label>
                <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="1"
                        step="0.01"
                        placeholder="Enter amount"
                        required
                >
            </div>

            <button type="submit" class="login-button">
                Transfer Money
            </button>

        </form>

    </div>

    <div class="dashboard-footer">
        <p>Demo ATM System • No real banking information</p>
    </div>

</div>

</body>
</html>
